# 5 个画像问题
# 每次启动 interview.py 时依次提问，答案写入 profile.yml

questions:
  - id: target_title
    question: "你的目标岗位是什么？（如 AI审计师、财务BI分析师、数据分析师等）"
    hint: "可以写多个，用 / 分隔"
    required: true

  - id: location
    question: "期望工作地点是哪里？"
    hint: "如：北京、上海、远程优先、不限"
    required: true

  - id: salary
    question: "期望薪资范围是多少？"
    hint: "如：月薪1.5万-3万 / 年薪20万-40万"
    required: true

  - id: experience
    question: "你的工作经验和背景是怎样的？"
    hint: "如：3年审计经验，会Python/SQL，有CPA"
    required: true

  - id: constraints
    question: "有什么硬性要求或绝对不能接受的条件吗？"
    hint: "如：不要事务所、不要单休、要有公积金、不要外包"
    required: false
